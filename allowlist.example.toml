# Corvidinho allowlist example — copy to ~/.config/corvidinho/allowlist.toml on the bot VM.
# NEVER commit real secrets or production IDs with tokens.
#
# Default-deny: empty allow lists REFUSE (not Merlin empty→BASIC).
# Deny overrides always win.
#
# Lists may span lines (trailing commas and # comments are fine):
#   deny_repos = [
#     "corvidlabs/secret",
#   ]
# A file that cannot be read or parsed is refused, never skipped: the bridge,
# watch and daemon do not start and gates refuse, so a broken deny list can
# never fall back to env-only allow. `corvidinho doctor` shows the line and key.
# deny_* keys belong in [github] / [discord] only (elsewhere they are refused).

# WATCH (github watch) also requires non-empty [github] orgs and/or repos
# plus users — empty = deny-all (ALLOW-1). See docs/WATCH.md.
[github]
orgs = []
repos = []          # "OWNER/REPO" or "OWNER/*"
users = []
deny_repos = []
deny_orgs = []
deny_users = []

[discord]
# The owner can change `channels` and `users` at runtime with /admin
# (ADMIN-1/2): the bridge rewrites just those lines in this file (atomic;
# other lines and comments kept) and applies them live. Env values stay
# read-only at runtime.
# REQUIRED non-empty for HEAR bridge start (also via DISCORD_CHANNEL_IDS env).
# Paste snowflake channel IDs from Discord (Developer Mode → Copy Channel ID).
channels = []
# Optional — both empty = anyone in an allowlisted channel may chat; once either has
# entries, only listed users / role holders (and the owner) pass. deny_* always wins.
# roles are role snowflakes, not role names.
roles = []
users = []
# Admin-shaped slash (DISCORD-7): ADMIN is owner-only (IDENTITY-2) — see [owner]
# below. No owner = nobody is ADMIN (default-deny). The old
# CORVIDINHO_DISCORD_ADMIN_USERS / _ROLES env lists are ignored.
deny_channels = []
deny_roles = []
deny_users = []

# Optional durable owner (IDENTITY-1). Env CORVIDINHO_OWNER_DISCORD_ID /
# CORVIDINHO_OWNER_GITHUB_LOGIN / CORVIDINHO_OWNER_DISPLAY override per field.
# discord_id must be the numeric user snowflake (quote it). The owner is ADMIN
# unless muted or on deny_users; empty = no owner = nobody is ADMIN
# (CORVIDINHO_DISCORD_ADMIN_USERS / _ROLES are ignored).
# Matching is by discord_id and, on GitHub, by github_id (your numeric GitHub
# user id: `gh api users/<login> --jq .id`) only — never by display, and never
# by github_login (IDENTITY-7.a: a renamed or re-registered login is someone
# else). Without github_id you are not recognised as the owner on GitHub
# (`corvidinho doctor` warns); github_login is only used to @mention you there.
# github_id is read from this file only (no env var).
# [owner]
# discord_id = "000000000000000000"
# github_id = "0"
# github_login = "your-github-login"
# display = "Your Name"

# Optional declared people (IDENTITY-13/14): who's who on Discord and GitHub.
# One [people.<id>] section per person; <id> is lowercase letters, digits,
# - or _ ("owner" is reserved). Keep each value on one line. Matching uses
# discord_ids and, on GitHub, github_ids only — never display, nicknames or
# github_logins (IDENTITY-7 / IDENTITY-7.a: a login can be renamed or
# re-registered, so it is only a label). An entry with github_logins but no
# github_ids still loads and still matches on Discord, but is not recognised on
# GitHub until an id is linked: add github_ids here, or run /admin people link
# person:<id> github:<login>, which looks the login's numeric id up once and
# stores it (`corvidinho doctor` lists who is missing one). An id listed for
# two people matches nobody. Only the owner changes this: here on the VM, or
# with /admin people add|link|unlink|remove (owner-only, audited) — never
# through chat (IDENTITY-6). Read live (no
# restart). Declare yourself by putting the owner's discord_id in your entry.
# Roles (IDENTITY-8..12): role = "team" (work tasks: /work edits + draft PR;
# reviews: github-issue-comment / github-pr-review as COMMENT on
# [github]-allowlisted repos; their own memory) or role = "community" (Q&A,
# read tools only; can't start /work). No role = community; the owner is always owner ([owner]
# above); anyone not declared here is community. Set it here or with
# /admin people role (owner-only, audited, ADMIN-3.b); re-read on every tool
# call.
# Daily briefing (COS-1/2/2.a): the owner and each team member get one DM a
# working day at the start of their working hours. Optional timezone (an IANA
# name) and working_hours ("HH:MM-HH:MM", 24 h, start before end); without a
# timezone it uses the owner's (the timezone on the entry holding the owner's
# discord_id), else UTC; without working_hours it starts at 09:00. Set them
# here or with /admin people add person:<id> timezone:<zone> hours:<HH:MM-HH:MM>.
# [people.tofu]
# display = "Tofu"
# role = "team"
# nicknames = ["T"]
# discord_ids = ["000000000000000000"]
# github_logins = ["tofu-dev"]
# github_ids = ["0"]
# timezone = "Europe/Oslo"
# working_hours = "08:30-16:30"

# Optional extras switch (PLUGIN-5 / PLUGIN-5.a). Both are on unless set here
# or in the install root's fledge.toml (off in either means off). This file is
# the update-proof place: the box updater never touches it. `work = false`
# turns off /work (and a reply or button press that would resume a /work talk);
# `schedule = false` turns off every /schedule subcommand and the scheduler's
# runs (bridge and daemon), while backups, Approve / forget cards and schedule
# questions keep going. Read on every command and tick: no restart. Runs in
# flight are not stopped. When schedules come back on, each overdue schedule
# runs at most once, so pause or delete ones you no longer want right away.
# Not changeable with /admin.
# [corvidinho.plugins]
# work = false
# schedule = false

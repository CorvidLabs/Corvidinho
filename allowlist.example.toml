# Corvidinho allowlist example — copy to ~/.config/corvidinho/allowlist.toml on the bot VM.
# NEVER commit real secrets or production IDs with tokens.
#
# Default-deny: empty allow lists REFUSE (not Merlin empty→BASIC).
# Deny overrides always win.
#
# Lists may span lines (trailing commas and # comments are fine):
#   deny_repos = [
#     "corvidlabs/secret",
#   ]
# A file that cannot be read or parsed is refused, never skipped: the bridge,
# watch and daemon do not start and gates refuse, so a broken deny list can
# never fall back to env-only allow.

# WATCH (github watch) also requires non-empty [github] orgs and/or repos
# plus users — empty = deny-all (ALLOW-1). See docs/WATCH.md.
[github]
orgs = []
repos = []
users = []
deny_repos = []
deny_orgs = []
deny_users = []

[discord]
# The owner can change `channels` and `users` at runtime with /admin
# (ADMIN-1/2): the bridge rewrites just those lines in this file (atomic;
# other lines and comments kept) and applies them live. Env values stay
# read-only at runtime.
# REQUIRED non-empty for HEAR bridge start (also via DISCORD_CHANNEL_IDS env).
# Paste snowflake channel IDs from Discord (Developer Mode → Copy Channel ID).
channels = []
# Optional — empty = deny-all when user/role gates apply
roles = []
users = []
# Admin-shaped slash (DISCORD-7): ADMIN is owner-only (IDENTITY-2) — see [owner]
# below. No owner = nobody is ADMIN (default-deny). The old
# CORVIDINHO_DISCORD_ADMIN_USERS / _ROLES env lists are ignored.
deny_channels = []
deny_roles = []
deny_users = []

# Optional durable owner (IDENTITY-1). Env CORVIDINHO_OWNER_DISCORD_ID /
# CORVIDINHO_OWNER_GITHUB_LOGIN / CORVIDINHO_OWNER_DISPLAY override per field.
# discord_id must be the numeric user snowflake (quote it). The owner is ADMIN
# unless muted or on deny_users; empty = no owner (admin env lists unchanged).
# Matching is by discord_id or github_login only — never by display.
# [owner]
# discord_id = "000000000000000000"
# github_login = "your-github-login"
# display = "Your Name"

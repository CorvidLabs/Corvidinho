name: release

# Every package version gets a vX.Y.Z tag and a GitHub Release with verbose notes.
# - Push to main: tag every release version from the oldest existing tag up to main's
#   package.json version that has no tag yet, oldest first, each at the commit that bumped
#   it, and create the Releases (a release PR needs no hand-pushed tag; a cancelled or
#   failed run is caught up by the next push).
# - Push of a vX.Y.Z tag (by a person): create that tag's Release.
# - workflow_dispatch on main: tag and release the listed versions (backfill), oldest first.
# A tag pushed with GITHUB_TOKEN starts no other workflow run, so this job creates the
# Releases itself. Existing tags and Releases are never moved, edited or deleted (only
# the Latest mark is set on main's version). GitHub starts no run when more than three
# tags are pushed at once: use the dispatch for bulk tags.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versions:
        description: "Package versions to tag and release, space-separated (e.g. 0.0.28 0.0.29)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip tag or branch deletions, and dispatches from any branch but main.
    if: ${{ !github.event.deleted && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tags to create or release
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          source scripts/lib/update-helpers.sh
          git fetch -q --force --tags origin
          git fetch -q origin "+refs/heads/main:refs/remotes/origin/main"
          versions="$RUNNER_TEMP/versions.txt"
          targets="$RUNNER_TEMP/targets.txt"
          package_version_commits origin/main > "$versions"
          : > "$targets"
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            if ! is_release_version "${REF_NAME#v}" || [[ "$REF_NAME" != v* ]]; then
              echo "::notice::${REF_NAME} is not a vX.Y.Z tag; nothing to release."
            else
              sha="$(git rev-list -n 1 "${REF_NAME}")"
              pkg="$(package_version_at "$sha")"
              [[ "$pkg" == "${REF_NAME#v}" ]] || echo "::warning::${REF_NAME} is on ${sha:0:7}, whose package.json version is '${pkg}'"
              git merge-base --is-ancestor "$sha" origin/main || echo "::warning::${REF_NAME} (${sha:0:7}) is not on main"
              echo "${REF_NAME} ${sha}" >> "$targets"
            fi
          elif [[ "$EVENT" == "push" ]]; then
            ver="$(package_version_at "$HEAD_SHA")"
            if ! is_release_version "$ver"; then
              echo "::notice::package.json version '${ver}' at ${HEAD_SHA:0:7} is not X.Y.Z; not tagging."
            else
              release_push_targets "$versions" "$ver" >> "$targets"
              [[ -s "$targets" ]] || { echo "::error::no main commit carries package version ${ver}"; exit 1; }
            fi
          else
            release_dispatch_targets "$versions" "$VERSIONS" >> "$targets" || { echo "::error::bad versions input"; exit 1; }
          fi
          latest="$(package_version_at origin/main)"
          is_release_version "$latest" || latest=""
          echo "::group::targets"; cat "$targets"; echo "::endgroup::"
          echo "file=${targets}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Tag and create Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ steps.targets.outputs.file }}
          LATEST: ${{ steps.targets.outputs.latest }}
        run: |
          set -euo pipefail
          source scripts/lib/update-helpers.sh
          git config user.name "Corvid Agent"
          git config user.email "95454608+corvid-agent@users.noreply.github.com"
          [[ -s "$TARGETS" ]] || { echo "::notice::nothing to tag or release"; exit 0; }
          while read -r tag sha <&3; do
            ver="${tag#v}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              at="$(git rev-list -n 1 "${tag}")"
              if [[ "$at" == "$sha" ]]; then
                echo "::notice::${tag} already tagged at ${at:0:7}"
              else
                echo "::warning::${tag} is at ${at:0:7}, not bump commit ${sha:0:7}; left as is"
              fi
            else
              git tag -a "${tag}" "${sha}" -m "$(release_tag_subject "${ver}" "${sha}")"
              if git push origin "refs/tags/${tag}"; then
                echo "::notice::tagged ${tag} at ${sha:0:7}"
              else
                # Someone pushed the same tag meanwhile: keep theirs.
                git fetch -q --force origin "refs/tags/${tag}:refs/tags/${tag}"
                echo "::warning::${tag} was created concurrently at $(git rev-list -n 1 "${tag}" | cut -c1-7); kept"
              fi
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "::notice::Release ${tag} already exists (idempotent)"
              if [[ "$ver" == "$LATEST" && "$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)" != "${tag}" ]]; then
                gh release edit "${tag}" --latest
                echo "::notice::marked ${tag} Latest"
              fi
              continue
            fi
            notes="$RUNNER_TEMP/notes-${tag}.md"
            release_notes "${tag}" > "$notes"
            latest=false
            [[ "$ver" == "$LATEST" ]] && latest=true
            gh release create "${tag}" --verify-tag --title "Corvidinho ${tag}" --notes-file "$notes" --latest="${latest}"
            echo "::notice::created Release ${tag} (latest=${latest})"
          done 3< "$TARGETS"

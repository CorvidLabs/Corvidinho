name: Spec Sync

# Official CorvidLabs/spec-sync@v6 Action only — no curl|bash install.sh.
# Visible dedicated job (SDD ON). Draft bootstrap specs: strict off so the
# draft-status warning is not a hard error; require-coverage stays 100.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: spec-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'

  spec-sync:
    needs: archive-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: spec-sync check
        id: specsync
        uses: CorvidLabs/spec-sync@v6
        with:
          version: "6.0.0"
          strict: false
          comment: false
          require-coverage: "100"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SDD change audit
        run: specsync change audit

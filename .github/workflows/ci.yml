name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'

  smoke:
    needs: archive-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: install
        run: bun install --frozen-lockfile

      - name: smoke (CLI --help)
        run: bun src/cli.ts --help

      - name: test
        run: bun test

      - name: typecheck
        run: bunx tsc --noEmit

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: install
        run: bun install --frozen-lockfile

      - name: smoke (CLI --help)
        run: bun src/cli.ts --help

      - name: test
        run: bun test

      - name: typecheck
        run: bunx tsc --noEmit

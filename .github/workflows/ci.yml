name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: install
        run: bun install --frozen-lockfile || bun install

      - name: smoke (CLI --help)
        run: bun src/cli.ts --help

      - name: test
        run: bun test

      - name: typecheck
        run: bunx tsc --noEmit

      - name: Install SpecSync
        run: |
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/spec-sync/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: spec-check
        run: specsync check

      - name: Install Fledge
        run: |
          curl -fsSL https://raw.githubusercontent.com/CorvidLabs/fledge/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: fledge verify lane
        run: fledge lanes run verify --non-interactive

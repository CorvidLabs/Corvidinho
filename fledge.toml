# Corvidinho — Bun/TS Linux agent (bootstrap)
# Prefer Fledge plugin commands over raw shell when a plugin covers the job.
#
# Verify lane: lint + smoke + tests + spec-check (Merlin pattern / SPECSYNC-2/7).
# CI still runs the dedicated `.github/workflows/spec-sync.yml` Spec Sync Action
# as a visible SDD gate — that Action is not replaced by this lane step.

[tasks.test]
cmd = "bun test"
description = "Unit and smoke tests"

[tasks.lint]
cmd = "bunx tsc --noEmit"
description = "Typecheck (lint stand-in until a dedicated linter lands)"

[tasks.typecheck]
cmd = "bunx tsc --noEmit"
description = "Typecheck"

[tasks.smoke]
cmd = "bun src/cli.ts --help"
description = "CLI --help exits 0 (placeholder/smoke)"

[tasks.hi-check]
cmd = "hi check"
description = "Validate hi/ criterion structure (optional if hi not on PATH)"

[tasks.spec-check]
cmd = "specsync check"
description = "SpecSync drift check — also on verify lane; CI Spec Sync Action remains"

[lanes.pre-commit]
description = "Run before committing"
steps = [
  { parallel = ["lint", "smoke"] },
  "test",
]

[lanes.ci]
description = "CI pipeline (Bun). SpecSync Action is still a separate workflow."
steps = ["lint", "smoke", "test"]

[lanes.verify]
description = "Required gate before claiming done (AGENT-4 / SPECSYNC-2). Includes local spec-check."
steps = ["lint", "smoke", "test", "spec-check"]

# Prove-before-done (AGENT-4 / FLEDGE-2). Merlin field names; Corvidinho section.
# Discord / WATCH spawns do NOT pass --no-verify (REQ-discord-085 / REQ-watch-085);
# empty filesChanged still skips the lane inside the agent loop. CLI --no-verify
# remains for local/operator opt-out only (REQ-cli-085).
[corvidinho]
verify_before_complete = true
max_retries = 3

# Autonomous mode (AUTONOMOUS-1) stays off until a project enables it here.
# When on, a code-tier lead may use `delegate` to hand subtasks to worker runs
# (AUTONOMOUS-5); otherwise the tool stays hidden (SAFE-9). Workers: same or
# lower tier, non-interactive, max 2 levels deep, 2 at once, 4 per run.
# It may also use `council` (AUTONOMOUS-6): 2-5 read-tier worker voices
# propose, critique, then a chair decides; 2 councils per run, 15 min cap.
# [corvidinho.autonomous]
# enabled = true

# Discord HEAR — local smoke without live token (CI uses bun test fixtures).
[tasks.bridge-smoke]
cmd = "bun src/cli.ts --protocol-version"
description = "Protocol version print (DISCORD-10 light)"
